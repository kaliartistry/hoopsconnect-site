name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.22.0
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.8.0

      - name: Install dependencies
        run: flutter pub get

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Check repository and Firebase target safety
        run: |
          npm --prefix scripts test
          node scripts/check_repository_safety.js

      - name: Run authorization Functions and Firestore rules tests
        run: node scripts/run_security_emulators.js

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Audit Functions dependencies
        working-directory: functions
        run: npm audit --audit-level=high

      - name: Build web
        run: flutter build web --release
