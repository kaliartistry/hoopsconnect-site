name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.22.0
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.8.0

      - name: Install dependencies
        run: flutter pub get

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Check repository and Firebase target safety
        run: |
          npm --prefix scripts test
          node scripts/check_repository_safety.js

      - name: Run authorization Functions and Firestore rules tests
        run: node scripts/run_security_emulators.js

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Run browser wire-contract regressions
        run: |
          flutter test --platform chrome test/models/official_stats/canonical_encoding_web_test.dart
          flutter test --platform chrome test/models/account_deletion/account_deletion_wire_web_test.dart
          flutter test --platform chrome test/models/official_stats/normalized_box_score_calculator_web_test.dart

      - name: Run optimized Dart2JS official-stat conformance
        run: bash scripts/run_optimized_dart2js_conformance.sh

      - name: Verify pinned Unicode normalization source
        run: npm --prefix scripts run verify:unicode-normalization

      - name: Run Packet 07 real-browser journal regressions
        run: |
          flutter test --platform chrome \
            test/services/local_game_journal/journal_astra_regression_test.dart \
            test/services/local_game_journal/journal_contract_test.dart \
            test/services/local_game_journal/journal_migrations_test.dart \
            test/services/local_game_journal/indexed_db_journal_store_web_test.dart

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Audit Functions dependencies
        working-directory: functions
        run: npm audit --audit-level=high

      - name: Build web
        run: flutter build web --release
