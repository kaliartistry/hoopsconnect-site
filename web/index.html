<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HoopsConnect is the public home for Jamaica Basketball League game results, standings, player and team statistics, and league news.">
  <meta property="og:title" content="Jamaica Basketball | HoopsConnect">
  <meta property="og:description" content="Browse recorded games, standings and statistics from Jamaica basketball.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2E7D32">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HoopsConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=jba-20260917">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=jba-20260917"/>

  <title>Jamaica Basketball | HoopsConnect</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; }
    #hoops-startup {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #f4f5f6;
      color: #13254a;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    .startup-card {
      box-sizing: border-box;
      width: min(32rem, 100% - 2rem);
      margin: 1rem;
      padding: 1.5rem;
      border: 1px solid #d6dde7;
      border-radius: 12px;
      background: white;
    }
    .startup-card h1 { font-size: 1.5rem; margin: 0; }
    .startup-card a { color: #184a9e; }
    .startup-card nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    .startup-card a:focus-visible { outline: 3px solid #184a9e; outline-offset: 3px; }
    #hoops-retry { margin-bottom: 1rem; }

    /* Keep Firebase's local-only safety notice visible without blocking the
       mobile navigation underneath it during emulator presentations. */
    .firebase-emulator-warning {
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <main id="hoops-startup">
    <div class="startup-card">
      <h1>Jamaica Basketball</h1>
      <p>HoopsConnect brings together recorded games, standings and player statistics.</p>
      <p id="hoops-status" role="status" hidden>Loading HoopsConnect…</p>
      <a id="hoops-retry" hidden>Retry this page</a>
      <noscript><p>HoopsConnect needs JavaScript to show league data. Turn it on, then reload this page.</p></noscript>
      <nav aria-label="League pages">
        <a href="public/games">Games</a>
        <a href="public/standings">Standings</a>
        <a href="public/leaders">Stats</a>
        <a href="public/media">Media</a>
      </nav>
    </div>
  </main>
  <script>
    (() => {
      const shell = document.getElementById('hoops-startup');
      const status = document.getElementById('hoops-status');
      const retry = document.getElementById('hoops-retry');
      const showFailure = () => {
        clearTimeout(timeout);
        status.textContent = 'HoopsConnect could not start. Check your connection and try again.';
        retry.hidden = false;
      };
      const timeout = setTimeout(showFailure, 18000);
      status.hidden = false;
      retry.href = location.href;
      // The loader and Firebase must reach Flutter's first rendered frame.
      // A successfully downloaded script alone does not mean the app started.
      window.addEventListener('flutter-first-frame', () => {
        clearTimeout(timeout);
        window.removeEventListener('hoops-bootstrap-error', showFailure);
        shell.remove();
      }, { once: true });
      window.addEventListener('hoops-bootstrap-error', showFailure, { once: true });
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      bootstrap.addEventListener('error', showFailure, { once: true });
      document.body.append(bootstrap);
    })();
  </script>
</body>
</html>
